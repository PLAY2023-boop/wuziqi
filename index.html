<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<title>五子棋 - 人机对战（带格子线+最后一步标记）</title>
<style>
  body {
    font-family: "Microsoft YaHei", sans-serif;
    background: #f5f5f5;
    text-align: center;
    margin: 0;
    padding: 20px;
  }
  h1 {
    color: #333;
  }
  #board {
    display: inline-block;
    border: 2px solid #8b4513;
    background: #deb887;
    padding: 10px;
    border-radius: 8px;
  }
  .row {
    display: flex;
  }
  .cell {
    width: 30px;
    height: 30px;
    position: relative;
    /* 绘制格子线 */
    background-image: 
      linear-gradient(#8b4513 1px, transparent 1px),
      linear-gradient(90deg, #8b4513 1px, transparent 1px);
    background-size: 30px 30px;
  }
  .piece {
    width: 26px;
    height: 26px;
    border-radius: 50%;
    position: absolute;
    top: 2px;
    left: 2px;
  }
  .black {
    background: #000;
  }
  .white {
    background: #fff;
    border: 1px solid #ccc;
  }
  /* 最后一步标记：黑棋白点、白棋红点 */
  .last-black::after {
    content: "";
    width: 8px;
    height: 8px;
    background: #fff;
    border-radius: 50%;
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
  }
  .last-white::after {
    content: "";
    width: 8px;
    height: 8px;
    background: red;
    border-radius: 50%;
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
  }
  #info {
    margin: 15px 0;
    font-size: 18px;
  }
  button {
    padding: 8px 16px;
    font-size: 16px;
    cursor: pointer;
  }
</style>
</head>
<body>
<h1>五子棋（人机对战）</h1>
<div id="info">你执黑先行</div>
<div id="board"></div>
<div style="margin-top:15px;">
  <button onclick="restartGame()">重新开始</button>
</div>

<script>
const BOARD_SIZE = 15;
let board = [];
let currentPlayer = "black";
let gameOver = false;

// 记录最后一步位置
let lastMove = null;

// 初始化棋盘
function initBoard() {
  const boardEl = document.getElementById("board");
  boardEl.innerHTML = "";
  board = Array(BOARD_SIZE).fill().map(() => Array(BOARD_SIZE).fill(null));
  lastMove = null;
  for (let r = 0; r < BOARD_SIZE; r++) {
    const rowEl = document.createElement("div");
    rowEl.className = "row";
    for (let c = 0; c < BOARD_SIZE; c++) {
      const cellEl = document.createElement("div");
      cellEl.className = "cell";
      cellEl.dataset.r = r;
      cellEl.dataset.c = c;
      cellEl.addEventListener("click", () => humanMove(r, c));
      rowEl.appendChild(cellEl);
    }
    boardEl.appendChild(rowEl);
  }
}

// 人类落子
function humanMove(r, c) {
  if (gameOver || board[r][c]) return;
  board[r][c] = "black";
  currentPlayer = "white";
  updateBoard();
  if (checkWin(r, c, "black")) {
    gameOver = true;
    document.getElementById("info").textContent = "你赢了！";
    return;
  }
  document.getElementById("info").textContent = "电脑思考中...";
  setTimeout(aiMove, 600);
}

// 电脑AI（较强）
function aiMove() {
  let best = null;
  let bestScore = -Infinity;
  for (let r = 0; r < BOARD_SIZE; r++) {
    for (let c = 0; c < BOARD_SIZE; c++) {
      if (!board[r][c]) {
        let score = evaluate(r, c);
        if (score > bestScore) {
          bestScore = score;
          best = { r, c };
        }
      }
    }
  }
  if (best) {
    board[best.r][best.c] = "white";
    currentPlayer = "black";
    updateBoard();
    if (checkWin(best.r, best.c, "white")) {
      gameOver = true;
      document.getElementById("info").textContent = "电脑赢了！";
      return;
    }
    document.getElementById("info").textContent = "你的回合（黑）";
  }
}

// 评分函数（进攻+防守）
function evaluate(r, c) {
  const dirs = [[1,0],[0,1],[1,1],[1,-1]];
  let score = 0;
  // 电脑自己的连线
  for (let [dr, dc] of dirs) {
    score += countLine(r, c, dr, dc, "white") * 10;
  }
  // 防守：人类连线
  for (let [dr, dc] of dirs) {
    score += countLine(r, c, dr, dc, "black") * 12;
  }
  return score;
}

function countLine(r, c, dr, dc, color) {
  let cnt = 1;
  for (let i = 1; i < 5; i++) {
    let nr = r + dr*i;
    let nc = c + dc*i;
    if (nr>=0 && nr<BOARD_SIZE && nc>=0 && nc<BOARD_SIZE && board[nr][nc]===color) cnt++;
    else break;
  }
  for (let i = 1; i < 5; i++) {
    let nr = r - dr*i;
    let nc = c - dc*i;
    if (nr>=0 && nr<BOARD_SIZE && nc>=0 && nc<BOARD_SIZE && board[nr][nc]===color) cnt++;
    else break;
  }
  return cnt;
}

// 检查胜利
function checkWin(r, c, color) {
  const dirs = [[1,0],[0,1],[1,1],[1,-1]];
  for (let [dr, dc] of dirs) {
    let cnt = 1;
    for (let i = 1; i < 5; i++) {
      let nr = r + dr*i;
      let nc = c + dc*i;
      if (nr>=0 && nr<BOARD_SIZE && nc>=0 && nc<BOARD_SIZE && board[nr][nc]===color) cnt++;
      else break;
    }
    for (let i = 1; i < 5; i++) {
      let nr = r - dr*i;
      let nc = c - dc*i;
      if (nr>=0 && nr<BOARD_SIZE && nc>=0 && nc<BOARD_SIZE && board[nr][nc]===color) cnt++;
      else break;
    }
    if (cnt >= 5) return true;
  }
  return false;
}

// 更新棋盘UI（带最后一步标记）
function updateBoard() {
  // 清除旧标记
  if (lastMove) {
    let old = document.querySelector(
      `.cell[data-r="${lastMove.r}"][data-c="${lastMove.c}"] .piece`
    );
    if (old) {
      old.classList.remove("last-black", "last-white");
    }
  }

  // 重绘所有棋子
  for (let r = 0; r < BOARD_SIZE; r++) {
    for (let c = 0; c < BOARD_SIZE; c++) {
      const cell = document.querySelector(`.cell[data-r="${r}"][data-c="${c}"]`);
      // 只清空棋子，保留格子线背景
      const existingPiece = cell.querySelector('.piece');
      if (existingPiece) {
        cell.removeChild(existingPiece);
      }
      if (board[r][c]) {
        const piece = document.createElement("div");
        piece.className = "piece " + board[r][c];
        cell.appendChild(piece);
      }
    }
  }

  // 设置新标记
  let foundNewMove = false;
  for (let r = 0; r < BOARD_SIZE; r++) {
    for (let c = 0; c < BOARD_SIZE; c++) {
      if (board[r][c] && (r !== lastMove?.r || c !== lastMove?.c)) {
        lastMove = { r, c };
        const piece = document.querySelector(
          `.cell[data-r="${r}"][data-c="${c}"] .piece`
        );
        if (piece) {
          if (board[r][c] === "black") {
            piece.classList.add("last-black");
          } else {
            piece.classList.add("last-white");
          }
        }
        foundNewMove = true;
        break;
      }
    }
    if (foundNewMove) break;
  }
}

function restartGame() {
  gameOver = false;
  currentPlayer = "black";
  document.getElementById("info").textContent = "你执黑先行";
  initBoard();
}

// 启动
initBoard();
</script>
</body>
</html>
